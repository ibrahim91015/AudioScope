plugins { id 'com.android.application' }
android {
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false
    namespace 'dev.audioscope'
    compileSdk 35
    buildToolsVersion '34.0.0'
    defaultConfig { applicationId 'dev.audioscope'; minSdk 33; targetSdk 35; versionCode 3; versionName '0.3.0'; testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
    buildFeatures { aidl true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug { if (System.getenv('AUDIOSCOPE_DEBUG_KEY')) { storeFile file(System.getenv('AUDIOSCOPE_DEBUG_KEY')); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
        if (rootProject.file('signing.properties').exists()) {
            def signing = new Properties()
            rootProject.file('signing.properties').withInputStream { signing.load(it) }
            release { storeFile rootProject.file(signing['storeFile']); storePassword signing['storePassword']; keyAlias signing['keyAlias']; keyPassword signing['keyPassword'] }
        }
    }
    buildTypes { release { minifyEnabled false; if(rootProject.file('signing.properties').exists()) signingConfig signingConfigs.release } }
    lint { abortOnError true }
    packaging { resources.excludes += ['META-INF/versions/**','META-INF/*.SF','META-INF/*.RSA','META-INF/*.DSA'] }
}
dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.81'
    testImplementation 'junit:junit:4.13.2'
}
// Some older Windows JDKs fail to close ZIP files under restricted process tokens.
// A newer compiler can be selected without changing the Gradle runtime.
tasks.withType(JavaCompile).configureEach {
    options.incremental = false
    if (System.getenv('AUDIOSCOPE_JAVAC')) {
        options.fork = true
        options.forkOptions.executable = System.getenv('AUDIOSCOPE_JAVAC')
    }
}
tasks.withType(Test).configureEach {
    // Keep unrelated quoted entries in the host PATH out of the test JVM command.
    systemProperty 'java.library.path', layout.buildDirectory.dir('test-native').get().asFile.path
}
